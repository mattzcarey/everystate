# Builds the native binaries and publishes the npm package.
# It runs when package.json or this file changes on main, on a tag `vX.Y.Z`, or from the Actions tab,
# and publishes only when the version in package.json is not on npm yet.
# Publishing uses npm trusted publishing (OIDC): no token is stored. The package lists this repository
# and the workflow file release.yml as its trusted publisher on npmjs.com.
name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', 'package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  npm: linux-x64,    exe: everystate }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, npm: linux-arm64,  exe: everystate }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,        npm: darwin-x64,   exe: everystate }
          # cross-compiled on the Intel runner: the arm64 macOS runners are often not assigned in time
          - { os: macos-15-intel,   target: aarch64-apple-darwin,       npm: darwin-arm64, exe: everystate, cross: true }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     npm: win32-x64,    exe: everystate.exe }  # also covers Windows paths and CRLF checkouts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --bin everystate --target ${{ matrix.target }}
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set +e
          target/${{ matrix.target }}/release/${{ matrix.exe }} examples/Counter.tla
          test $? -eq 12
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: everystate-${{ matrix.npm }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
      id-token: write   # npm trusted publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts
      - name: Build the WebAssembly module and run the tests
        run: |
          cargo build --release
          sh wasm/build.sh
          npm test
      - name: Put the binaries in native/<platform>-<arch>/
        run: |
          for dir in artifacts/everystate-*; do
            pa=$(basename "$dir"); pa=${pa#everystate-}
            mkdir -p "native/$pa"
            cp "$dir"/* "native/$pa/"
            chmod 755 "native/$pa"/*
          done
          ls -lR native
          test "$(ls native | wc -l)" -eq 5
          set +e
          node bin/everystate.mjs examples/Counter.tla
          test $? -eq 12
      - name: Publish everystate
        id: publish
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "everystate@$version" version >/dev/null 2>&1; then echo "everystate@$version already published"; exit 0; fi
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Attach the binaries to a GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.publish.outputs.version }}
        run: |
          mkdir dist
          for dir in artifacts/everystate-*; do
            name=$(basename "$dir")
            (cd "$dir" && tar czf "../../dist/$name.tar.gz" *)
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      # Needs a repository secret HOMEBREW_TAP_TOKEN: a fine-grained token with Contents write access
      # to mattzcarey/homebrew-tap only. Skipped when the secret is not set.
      - name: Is the tap token set?
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: if [ -n "$TAP_TOKEN" ]; then echo "token=true" >> "$GITHUB_OUTPUT"; fi
      - name: Update the Homebrew formula
        if: steps.publish.outputs.published == 'true' && steps.tap.outputs.token == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/mattzcarey/homebrew-tap.git" tap
          mkdir -p tap/Formula
          node scripts/brew-formula.mjs "$VERSION" dist > tap/Formula/everystate.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/everystate.rb
          git diff --cached --quiet || git commit -m "everystate $VERSION"
          git push

  # crates.io trusted publishing: the crate lists this repository and release.yml as its trusted publisher.
  crate:
    needs: publish
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Is this version on crates.io already?
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "everystate-release-workflow" "https://crates.io/api/v1/crates/everystate/$version")
          echo "everystate $version: HTTP $code"
          if [ "$code" != 200 ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        if: steps.check.outputs.publish == 'true'
        id: auth
      - if: steps.check.outputs.publish == 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
