[package]
name = "everystate"
version = "0.3.1"
edition = "2021"
repository = "https://github.com/mattzcarey/everystate"
description = "A TLA+ model checker with no Java dependency (TLC-compatible)"
license = "MIT"
readme = "README.md"
keywords = ["tla", "tlaplus", "model-checker", "formal-verification"]
categories = ["development-tools", "command-line-utilities"]
include = ["src/**", "lib/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "everystate"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "everystate"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.profiling]
inherits = "release"
debug = true
lto = "thin"
